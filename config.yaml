server:
  addr: ":8087"
  access_log: "logs/access.log"
  # Only trust X-Forwarded-For/X-Real-IP from these proxies.
  trusted_proxies: []

timezone: "Asia/Shanghai"

# Optional external theme directory. Empty uses the embedded Paper & Ink theme.
# Missing templates/assets fall back to the embedded theme.
theme: ""

security:
  secret: ""

# Compile-time plugins. Built-in plugins are registered in plugins/plugins.go.
plugins:
  # Built-ins: eventlog, typecho-redirects.
  enabled: []
  # config: {}

database:
  path: "./data/pionus.db"

upload:
  dir: "./uploads"
  max_size_mb: 10

session:
  cookie_name: "pionus_session"
  ttl_hours: 168
  secure: false

tls:
  cert: ""
  key: ""
