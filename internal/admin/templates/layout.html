{{define "layout"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.SiteTitle}}</title>
<style>
:root{
  --bg:#f5f5f2; --panel:#ffffff; --text:#1c1c1a; --muted:#77776e;
  --line:#e3e1d9; --accent:#2f6f4f; --accent-weak:#e8f1ec;
  --danger:#b23a3a; --warn:#9a6a1e; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.topbar{display:flex;align-items:center;gap:24px;padding:0 28px;height:58px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:650;font-size:16px;color:var(--text)}
.topbar nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.topbar nav a{padding:6px 10px;border-radius:6px;color:var(--muted);font-size:14px}
.topbar nav a:hover{background:var(--bg);text-decoration:none;color:var(--text)}
.topbar nav a.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.me{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.me form{display:inline}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;padding:0}
main{max-width:1120px;margin:0 auto;padding:28px 24px 64px}
.flash{max-width:1120px;margin:16px auto -8px;padding:10px 16px;background:var(--accent-weak);color:var(--accent);border-radius:var(--radius);font-size:14px}
h1{font-size:24px;margin:0 0 20px}
h2{font-size:18px;margin:0 0 12px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.btn{display:inline-block;padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit;font-size:14px}
.btn:hover{text-decoration:none;border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:#e6c9c9}
.btn.small{padding:4px 9px;font-size:12px}
form.inline{display:inline}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=email],input[type=url],input[type=number],input[type=datetime-local],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;color:var(--text)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
textarea{min-height:320px;resize:vertical;font-family:"SF Mono","Fira Code",Menlo,monospace;font-size:13px;line-height:1.7}
.field{margin-bottom:16px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
.check{display:flex;align-items:center;gap:7px;color:var(--text);font-size:14px;margin-bottom:7px}
.check input{width:auto}
.muted{color:var(--muted);font-size:13px}
.error{padding:10px 14px;background:#fbeaea;color:var(--danger);border-radius:8px;margin-bottom:16px;font-size:14px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:20px;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:6px 12px;border-radius:7px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs a.active{background:var(--accent-weak);border-color:var(--accent-weak);color:var(--accent);font-weight:600}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.editor-side .panel{position:sticky;top:78px}
.preview{display:none;margin-top:16px;border:1px dashed var(--line);border-radius:8px;padding:16px;background:#fff}
.preview.open{display:block}
.preview img{max-width:100%}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.media-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-size:12px}
.media-card img{width:100%;height:110px;object-fit:cover;border-radius:6px;background:var(--bg)}
.media-card code{display:block;word-break:break-all;color:var(--muted);margin:6px 0}
.comment{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.comment .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.comment .body{white-space:pre-wrap;font-size:14px}
footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12px}
@media(max-width:860px){.editor{grid-template-columns:1fr}.topbar{height:auto;padding:12px 16px;flex-wrap:wrap}.me{width:100%}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/admin">{{.SiteTitle}}</a>
  <nav>
    <a href="/admin" {{if eq .Path "/admin"}}class="active"{{end}}>概览</a>
    <a href="/admin/posts" {{if contains .Path "/posts"}}class="active"{{end}}>文章</a>
    <a href="/admin/notes" {{if contains .Path "/notes"}}class="active"{{end}}>微语</a>
    <a href="/admin/comments" {{if contains .Path "/comments"}}class="active"{{end}}>评论</a>
    <a href="/admin/media" {{if contains .Path "/media"}}class="active"{{end}}>媒体</a>
    <a href="/admin/categories" {{if contains .Path "/categories"}}class="active"{{end}}>分类</a>
    <a href="/admin/tags" {{if contains .Path "/tags"}}class="active"{{end}}>标签</a>
    <a href="/admin/settings" {{if contains .Path "/settings"}}class="active"{{end}}>设置</a>
  </nav>
  <div class="me">
    <span>{{.User.DisplayName}}</span>
    <a href="/" target="_blank" rel="noopener">查看站点</a>
    <form method="post" action="/admin/logout">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button class="link" type="submit">退出</button>
    </form>
  </div>
</header>
{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
<main>{{template "content" .}}</main>
<footer>Pionus · {{.CurrentYear}}</footer>
</body>
</html>
{{end}}
