<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{.SiteTitle}}</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--text:#1c1c1a;--muted:#77776e;--line:#e3e1d9;--accent:#2f6f4f;--danger:#b23a3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
.card{width:min(400px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px}
h1{font-size:22px;margin:0 0 4px}
.muted{color:var(--muted);font-size:13px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font:inherit}
input:focus{outline:2px solid #e8f1ec;border-color:var(--accent)}
button{width:100%;margin-top:20px;padding:10px;border:0;border-radius:7px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.error{padding:9px 12px;background:#fbeaea;color:var(--danger);border-radius:7px;font-size:13px}
a{color:var(--accent)}
.footer{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <h1>{{.SiteTitle}}</h1>
  <p class="muted">登录后台管理</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" action="/admin/login">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="username">用户名</label>
    <input id="username" type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus required>
    <label for="password">密码</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
  <p class="footer"><a href="/">← 返回站点</a></p>
</div>
</body>
</html>
