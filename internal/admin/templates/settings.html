{{template "layout" .}}

{{define "content"}}
<h1>设置</h1>

<form class="panel" method="post" action="/admin/settings">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">

  <h2>站点</h2>
  <div class="row">
    <div>
      <label for="site.title">站点名称</label>
      <input id="site.title" type="text" name="site.title" value="{{index .Options "site.title"}}" required>
    </div>
    <div>
      <label for="site.author">作者</label>
      <input id="site.author" type="text" name="site.author" value="{{index .Options "site.author"}}">
    </div>
  </div>
  <div class="field">
    <label for="site.description">站点描述</label>
    <input id="site.description" type="text" name="site.description" value="{{index .Options "site.description"}}">
  </div>
  <div class="row">
    <div>
      <label for="site.url">站点 URL</label>
      <input id="site.url" type="url" name="site.url" value="{{index .Options "site.url"}}" placeholder="https://example.com">
    </div>
    <div>
      <label for="site.keywords">关键词</label>
      <input id="site.keywords" type="text" name="site.keywords" value="{{index .Options "site.keywords"}}" placeholder="用逗号分隔">
    </div>
    <div>
      <label for="site.locale">语言</label>
      <input id="site.locale" type="text" name="site.locale" value="{{index .Options "site.locale"}}" placeholder="zh-CN">
    </div>
    <div>
      <label for="posts.per_page">每页文章数</label>
      <input id="posts.per_page" type="number" name="posts.per_page" min="1" max="200" value="{{index .Options "posts.per_page"}}">
    </div>
  </div>

  <h2 style="margin-top:24px">评论</h2>
  <label class="check">
    <input type="checkbox" name="comments.enabled" value="1" {{if eq (index .Options "comments.enabled") "1"}}checked{{end}}>
    开启评论
  </label>
  <label class="check">
    <input type="checkbox" name="comments.moderation" value="1" {{if eq (index .Options "comments.moderation") "1"}}checked{{end}}>
    新评论需要审核
  </label>

  <div style="margin-top:22px">
    <button class="btn primary" type="submit">保存设置</button>
  </div>
</form>
{{end}}
