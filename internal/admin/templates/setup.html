<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初始化 · {{.SiteTitle}}</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--text:#1c1c1a;--muted:#77776e;--line:#e3e1d9;--accent:#2f6f4f;--danger:#b23a3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
.card{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px}
h1{font-size:22px;margin:0 0 4px}
.muted{color:var(--muted);font-size:13px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font:inherit}
input:focus{outline:2px solid #e8f1ec;border-color:var(--accent)}
button{width:100%;margin-top:22px;padding:10px;border:0;border-radius:7px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.error{padding:9px 12px;background:#fbeaea;color:var(--danger);border-radius:7px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>初始化博客</h1>
  <p class="muted">创建第一个管理员账号，完成后即可进入后台。</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" action="/admin/setup">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="site_title">站点名称</label>
    <input id="site_title" type="text" name="site_title" value="{{.FormSiteTitle}}" required>
    <label for="username">管理员用户名</label>
    <input id="username" type="text" name="username" value="{{.Username}}" autocomplete="username" required>
    <div class="hint">3–32 位字母、数字、下划线或连字符。</div>
    <label for="email">邮箱</label>
    <input id="email" type="email" name="email" value="{{.Email}}" autocomplete="email" required>
    <label for="password">密码</label>
    <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">确认密码</label>
    <input id="confirm" type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    <button type="submit">创建并登录</button>
  </form>
</div>
</body>
</html>
