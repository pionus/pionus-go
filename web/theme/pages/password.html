{{template "layout" .}}

{{define "content"}}
<article class="post">
  <header class="post-head">
    {{if .Post.Categories}}
    <div class="cats">
      {{range .Post.Categories}}<a href="/category/{{.Slug}}">{{.Name}}</a>{{end}}
    </div>
    {{end}}
    <h1>{{.Post.Title}}</h1>
    <p class="post-meta">
      {{if .Post.Author}}<span>{{.Post.Author}}</span>{{end}}
      <time datetime="{{.Post.DisplayTime.Format "2006-01-02T15:04:05Z07:00"}}">{{date .Post.DisplayTime}}</time>
      <span>密码保护</span>
    </p>
  </header>

  <div class="password-box">
    <p>这篇文章需要密码才能阅读。</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="post" action="{{.UnlockAction}}">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <label>密码
        <input type="password" name="password" required autofocus autocomplete="current-password">
      </label>
      <button type="submit">阅读文章</button>
    </form>
  </div>
</article>
{{end}}

{{define "scripts"}}{{end}}
